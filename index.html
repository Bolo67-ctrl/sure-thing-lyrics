<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sure Thing Animation</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="scene">
    <div id="startScreen">
      <h1>Sure Thing</h1>
      <p>Two-box lyric animation</p>
      <button id="startBtn">START</button>
    </div>

    <div id="lyricBoxes" aria-live="polite">
      <div class="lyric-box" id="box1">
        <span class="lyric-text"></span>
      </div>

      <div class="lyric-box" id="box2">
        <span class="lyric-text"></span>
      </div>
    </div>
  </div>

  <audio id="song" src="sure-thing.mp3" preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
